name: Import RisingOS Vendor blobs for Evolution X
on:
  push:
    paths:
      - .github/workflows/import-from-rising.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Merge pinned source tree and preserve history, gitlinks and LFS pointers
        run: |
          set -euo pipefail
          git config user.name Hecker
          git config user.email 118846180+its-hecker@users.noreply.github.com
          git remote add rising https://github.com/its-hecker/risingos-coral-vendor.git
          git fetch --no-tags rising main
          test "$(git rev-parse FETCH_HEAD)" = "4f6bbebd0d3f82040bdc9c03386add98e7919b71"
          git merge --no-ff --no-edit --allow-unrelated-histories FETCH_HEAD
          find .github/workflows -maxdepth 1 -type f ! -name import-from-rising.yml -delete
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "evox: remove imported RisingOS-only automation"
          fi

      - name: Publish independent Evolution X repository
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null push origin HEAD:main
